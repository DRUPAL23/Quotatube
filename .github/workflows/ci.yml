name: CI
on:
  push:
    branches: [main, setup/ci-cd]
  pull_request:
    branches: [main, setup/ci-cd]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then echo "type=node" >> "$GITHUB_OUTPUT"; else echo "type=generic" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'node'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.detect.outputs.type == 'node'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.type == 'node'
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.type == 'node'
        run: npm test --if-present
      - name: Build
        if: steps.detect.outputs.type == 'node'
        run: npm run build --if-present
